<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tonight's Poem · Text</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Instrument+Sans:wght@500&display=swap">
<style>
/* plain white, to blend into the site (Maxx, 2026-11-08); the same type as the sheet in the 3D room */
:root {
  --ground: #ffffff; --ink: #1b1b1b; --soft: #55575b; --faint: #8b8378; --label: #8b8378;
  --serif: "EB Garamond", Garamond, "Times New Roman", serif; --ui: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--serif);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(28px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px)); }
main { max-width: 34em; margin: 0 auto; }
article { }
h1 { margin: 0 0 .15em; font-weight: 500; font-size: clamp(1.45rem, 4.5vw, 1.75rem); line-height: 1.2; text-wrap: balance; }
.author { margin: 0; font-style: italic; font-size: 1.08rem; color: var(--soft); }
.from { margin: .25em 0 0; font-size: .95rem; color: var(--faint); }
.lines { margin: 1.4em 0 0; white-space: pre-wrap; font-size: clamp(1.06rem, 3.6vw, 1.17rem); line-height: 1.55; overflow-wrap: break-word; }
.more { margin: 2.2em 0 0; font-size: .95rem; color: var(--faint); display: flex; flex-wrap: wrap; gap: .3em 1.2em; align-items: baseline; }
.more a { color: var(--soft); text-decoration: underline; text-decoration-color: #cfc9be; text-underline-offset: .18em; }
.more a:hover { color: var(--ink); text-decoration-color: currentColor; }
@media print { body { padding: 0; } .more { display: none; } article { animation: none !important; } .lines { font-size: 12pt; line-height: 1.5; } h1 { font-size: 18pt; } }
@media (prefers-reduced-motion: no-preference) { article { animation: rise .6s ease-out both; } @keyframes rise { from { opacity: 0; transform: translateY(6px); } } }
</style>
<noscript><style>#l { display: none; }</style></noscript>
</head>
<body>
<main>
  <article aria-labelledby="t">
    <h1 id="t"></h1>
    <p class="author" id="a"></p>
    <p class="from" id="f" hidden></p>
    <p class="lines" id="l">Loading tonight’s poem…</p>
    <noscript><p class="lines">Tonight’s poem is loaded by JavaScript, which is off in this browser.</p></noscript>
  </article>
  <p class="more"><a id="src" hidden target="_blank" rel="noopener"></a><a href="archive.html">Archive</a></p>
</main>
<script>
(function () {
  function show(p) {
    document.getElementById('t').textContent = p.title;
    document.getElementById('a').textContent = p.author;
    var f = document.getElementById('f'); f.innerHTML = '';
    if (p.collection) { f.append('from '); var i = document.createElement('i'); i.textContent = p.collection; f.append(i); }
    if (p.year) f.append((p.collection ? ' · ' : '') + p.year);
    f.hidden = !(p.collection || p.year);
    document.getElementById('l').textContent = (p.lines || []).join('\n');
    var src = document.getElementById('src'), ok = typeof p.url === 'string' && /^https:\/\//.test(p.url);   // where the poem lives (e.g. its American Life in Poetry column)
    src.hidden = !ok; if (ok) { src.href = p.url; src.textContent = 'Read it at ' + (p.source || 'its source'); }
  }
  // Tonight's poem lives only on the Notturno endpoint (Cloudflare); no poem text is kept on this site. If the endpoint
  // cannot be reached, or does not answer with a poem, a quiet note takes the poem's place.
  var ENDPOINT = 'https://notturno-poems.notturno-poema.workers.dev';
  function get(u) { return fetch(u, { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); }
  function valid(p) { return p && typeof p.title === 'string' && Array.isArray(p.lines) && p.lines.length > 0; }
  function fail() { document.getElementById('l').textContent = 'Tonight’s poem couldn’t be loaded just now. Please try again in a little while.'; }
  try {
    get(ENDPOINT + '/poem.json').then(function (p) { if (valid(p)) show(p); else fail(); }, fail);
  } catch (e) { fail(); }
})();
</script>
</body>
</html>
