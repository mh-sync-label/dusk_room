<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notturno · Tonight's Moon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400&display=swap">
<style>
/* Tonight's Notturno moon for the /notturno site logo (2026-11-08): "B4 · True to the scan" disc with "N7 · Counted" n's,
   chosen by Maxx, with each n drawn as an Inter Tight capital U turned upside down. The dark part of tonight's Moon is a stipple of ~1100 tiny vector dots, denser toward the edge, with
   pale flecks near the limb like his scanned moons. The number of n's is the phase (lit share x 12), set evenly just
   outside the lit edge and nudged by hand-like jitter; a new moon is the disc alone, a full moon the ring of n's alone.
   Nothing loads in (Maxx); every 20 s one n fades out and back. Transparent; the SVG fills the frame.
   ?phase=0..1 previews a phase (0 new, .5 full). ?home=0 drops the home link. ?scale=0.5..1 sizes the mark within the
   frame (default SCALE below). Reduced motion: no fading. */
html, body { margin: 0; height: 100%; background: transparent; }
a, .m { display: block; width: 100%; height: 100%; }
svg { display: block; width: 100%; height: 100%; }
a:focus-visible { outline: 1px solid #555; outline-offset: -2px; }
</style>
</head>
<body>
<a id="home" href="https://www.maxxhillery.com/" target="_top" aria-label="Home"><svg id="s" viewBox="0 0 56 56" role="img" aria-labelledby="t"><title id="t">Notturno moon logo</title></svg></a>
<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg', FONT = 'Inter Tight, Helvetica Neue, Arial, sans-serif', svg = document.getElementById('s');
  // the mark's size within the frame (Maxx: smaller overall); the frame itself is set in Figma
  var SCALE = 1, sm = /[?&]scale=([0-9.]+)/.exec(location.search); if (sm) SCALE = Math.min(1, Math.max(0.4, parseFloat(sm[1])));
  var VB = 56 / SCALE, o = (56 - VB) / 2; svg.setAttribute('viewBox', o.toFixed(2) + ' ' + o.toFixed(2) + ' ' + VB.toFixed(2) + ' ' + VB.toFixed(2));
  var NAMES = ['New moon', 'Waxing crescent', 'First quarter', 'Waxing gibbous', 'Full moon', 'Waning gibbous', 'Last quarter', 'Waning crescent'];
  var REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches, q = location.search, m = /[?&]phase=([0-9.]+)/.exec(q), f;
  if (m) f = Math.min(1, Math.max(0, parseFloat(m[1])));
  else { var d = new Date(); d.setHours(21, 0, 0, 0);            // the same reckoning as the room: tonight at 9 pm
    f = (((d.getTime() / 86400000 + 2440587.5 - 2451550.1) % 29.530588853 + 29.530588853) % 29.530588853) / 29.530588853; }
  document.getElementById('t').textContent = 'Notturno moon logo: ' + NAMES[Math.floor(f * 8 + 0.5) % 8].toLowerCase() + ' tonight';
  if (/[?&]home=0/.test(q)) { var a = document.getElementById('home'); a.removeAttribute('href'); a.removeAttribute('aria-label'); a.className = 'm'; }

  function el(tag, attrs, parent) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function isLit(x, y, R) { var k = Math.cos(2 * Math.PI * f), h = Math.sqrt(Math.max(0, R * R - y * y)); return f < 0.5 ? x > k * h : x < -k * h; }

  // the disc (B4): fixed seed, so it is the same grain every night; only the lit part changes
  var c = 28, R = 17, r = rng(11), fl = [], g = el('g', { fill: '#141414' }, svg), n = 0;
  for (var i = 0; i < 9; i++) { var fa = r() * 6.283, fd = R * (0.72 + r() * 0.24); fl.push([fd * Math.cos(fa), fd * Math.sin(fa), 0.9 + r() * 1.9]); }
  // every candidate draws the same random numbers whatever the phase, and the cap counts the whole disc,
  // so the grain is identical every night and the lit part simply leaves dots out
  for (var j = 0; j < 5200 && n < 1250; j++) {
    var x = (r() * 2 - 1) * R, y = (r() * 2 - 1) * R, dd = Math.hypot(x, y), keep = r(), rad = (0.28 + r() * 0.27).toFixed(2), fr = r();
    if (dd > R || keep > 0.5 + 0.5 * Math.pow(dd / R, 2)) continue;
    n++;
    var inF = false; for (var k = 0; k < fl.length; k++) if (Math.hypot(x - fl[k][0], y - fl[k][1]) < fl[k][2]) { inF = fr < 0.85; break; }
    if (inF || isLit(x, y, R)) continue;
    el('circle', { cx: (c + x).toFixed(2), cy: (c + y).toFixed(2), r: rad }, g);
  }

  // the n's (N7): the count is the phase
  var il = (1 - Math.cos(2 * Math.PI * f)) / 2, count = Math.round(il * 12), ns = [], r2 = rng(7);
  if (count > 0) {
    var full = il > 0.92, dir = f < 0.5 ? 0 : 180, span = full ? 360 : 170;
    for (var p = 0; p < count; p++) {
      var ang = (dir - span / 2 + span * (p + 0.5) / count) * Math.PI / 180, px = c + (R + 4.5) * Math.cos(ang), py = c + (R + 4.5) * Math.sin(ang);
      // an Inter Tight capital U turned upside down (Maxx: no spur), sized to about the height of a lowercase n
      var tx = (px + (r2() - 0.5) * 2.4).toFixed(2), ty = (py + (r2() - 0.5) * 2.4).toFixed(2);
      var t = el('text', { x: tx, y: ty, 'font-size': 3.8, 'font-family': FONT, 'text-anchor': 'middle', 'dominant-baseline': 'central',
        fill: '#141414', transform: 'rotate(180 ' + tx + ' ' + ty + ')' }, svg);
      t.textContent = 'U'; ns.push(t);
    }
  }   // a new moon is the grain disc alone, with no n (Maxx)

  // every 20 s, one n fades out and back over 1.5 s
  if (!REDUCE && ns.length) {
    var t0 = performance.now(), cyc = -1, pick = null;
    (function tick(now) {
      var e = now - t0, cc = Math.floor(e / 20000), tc = e % 20000;
      if (cc !== cyc) { cyc = cc; if (pick) pick.setAttribute('opacity', 1); pick = cc > 0 ? ns[Math.floor(r2() * ns.length)] : null; }
      if (pick) pick.setAttribute('opacity', tc < 1500 ? (0.5 + 0.5 * Math.cos(tc / 1500 * 6.283)).toFixed(3) : 1);
      requestAnimationFrame(tick);
    })(t0);
  }
})();
</script>
</body>
</html>
