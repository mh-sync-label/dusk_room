<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notturno · Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* The archive: which poems have run, never their text. Set like the widget's poem sheet (the round chip at the head, the
   sheet's type and quiet lines) on the site's plain white (text.html). --quiet is the sheet's faint, darkened to 5.5:1 on
   white because here the dates and the "from" lines carry information. */
:root { --ground: #ffffff; --ink: #1b1b1b; --soft: #55575b; --quiet: #6f685e; --hair: #cfc9be; --chip: #161616;
  --serif: "EB Garamond", Garamond, "Times New Roman", serif; color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--serif); font-size: 1.0625rem; line-height: 1.4;
  -webkit-text-size-adjust: 100%; text-rendering: optimizeLegibility;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(clamp(24px, 6vh, 64px), env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px)); }
main { max-width: 36rem; margin: 0 auto; }
a { color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-decoration-color: var(--hair); text-underline-offset: .2em; }
a:hover { text-decoration-color: currentColor; }
a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 2px; }

/* the head: the chip, centred as on the sheet, leads back to tonight's poem */
.chip { display: grid; place-items: center; width: 48px; height: 48px; margin: 0 auto 2.4rem; border-radius: 50%;
  background: var(--chip); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.chip img { display: block; width: 27px; height: auto; margin-top: 1px; }
.chip:focus-visible { outline-offset: 4px; border-radius: 50%; }
h1 { margin: 0 0 .3em; font-weight: 500; font-size: clamp(1.6rem, 5vw, 1.85rem); line-height: 1.15; }
.lead { margin: 0; color: var(--soft); }
.lead + .lead { margin-top: .15em; }

/* the list: months as quiet italic heads, each night with its date in the margin */
#list { margin-top: 2.6rem; }
h2 { margin: 2.4rem 0 .9rem; font-weight: 400; font-style: italic; font-size: 1rem; color: var(--soft); }
h2:first-child { margin-top: 0; }
ol { list-style: none; margin: 0; padding: 0; }
li { display: grid; grid-template-columns: 3.4rem minmax(0, 1fr); gap: 0 .9rem; padding: .55rem 0 .7rem; }
time { color: var(--quiet); font-size: .9rem; font-variant-numeric: tabular-nums; line-height: 1.3; padding-top: .3rem; white-space: nowrap; }
.t { margin: 0; font-weight: 500; font-size: 1.18rem; line-height: 1.3; overflow-wrap: break-word; text-wrap: pretty; }
/* each link is its own target: vertical padding (not a bigger font) gives it a tap height of at least 40px without
   moving the lines; an entry with no known book or page is plain text, title and poet */
.t a, .f a { padding-block: 12px; }
.f a { color: var(--soft); }
.f a:hover { color: var(--ink); }
.nb { white-space: nowrap; }
.out { display: inline-block; width: .52em; height: .52em; margin-left: .22em; vertical-align: .32em; color: var(--quiet); }
.a { margin: .05em 0 0; font-style: italic; color: var(--soft); }
.f, .w { margin: .1em 0 0; font-size: .92rem; color: var(--quiet); }
.w { margin-top: .2em; }
.now .w { color: var(--ink); font-style: italic; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.note { margin: 0; color: var(--soft); }

/* the foot: tonight's poem, and the copyright as the quietest line */
footer { max-width: 36rem; margin: 3.4rem auto 0; font-size: .95rem; }
footer p { margin: 0; }
footer a { display: inline-block; padding-block: .6rem; color: var(--soft); }
footer a:hover { color: var(--ink); }
.copy { margin-top: .4rem; font-size: .85rem; color: var(--quiet); }

@media (max-width: 380px) { li { grid-template-columns: 3.1rem minmax(0, 1fr); gap: 0 .75rem; } }
@media print {
  @page { margin: 18mm 20mm; }
  body { padding: 0; font-size: 11pt; color: #000; }
  :root { --soft: #000; --quiet: #333; --ink: #000; }
  main, footer { max-width: none; }
  .chip { margin: 0 0 14pt; width: 30pt; height: 30pt; } .chip img { width: 17pt; }
  h1 { font-size: 18pt; } #list { margin-top: 16pt; } h2 { margin: 14pt 0 4pt; }
  li { padding: 3pt 0 5pt; break-inside: avoid; } h2 { break-after: avoid; }
  a { text-decoration: none; outline: none !important; } .out { display: none; }
  footer { margin-top: 18pt; } footer .back { display: none; }
}
</style>
</head>
<body>
<main>
  <a class="chip" href="index.html" title="Tonight’s poem"><img src="assets/notturno-logo.png" width="108" height="91" alt="Notturno"></a>
  <h1>Archive</h1>
  <p class="lead">Each poem was up for two nights.</p>
  <p class="lead">The poems are not kept here. Each is listed with the book it comes from, where known, and a link to its publisher.</p>
  <div id="list" aria-live="polite"><p class="note">Loading the list…</p></div>
</main>
<footer>
  <p class="back"><a href="index.html">Tonight’s poem</a></p>
  <p class="copy">© 2026 Maxx Hillery</p>
</footer>
<script>
(function () {
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var SVG = 'http://www.w3.org/2000/svg';
  function parts(d) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || ''); return m ? { y: +m[1], mo: +m[2] - 1, d: +m[3] } : null; }
  function month(d) { var p = parts(d); return p ? MONTHS[p.mo] + ' ' + p.y : ''; }                       // the heading a night files under
  function day(d) { var p = parts(d); return p ? DAYS[new Date(Date.UTC(p.y, p.mo, p.d)).getUTCDay()] + ' ' + p.d : ''; }
  function longDay(d) { var p = parts(d); return p ? p.d + ' ' + MONTHS[p.mo] + ' ' + p.y : ''; }
  // a link from the data is used only if it is a plain https URL (no user:password@ part); anything else counts as absent
  function safe(u) {
    if (typeof u !== 'string' || !/^https:\/\/[^\s"'<>]+$/.test(u)) return null;
    try { var x = new URL(u); return x.protocol === 'https:' && x.hostname && !x.username && !x.password ? x.href : null; } catch (e) { return null; }
  }
  function str(v) { return v == null ? '' : String(v); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function arrow() {                                                                                       // the "leaves this site" mark
    var s = document.createElementNS(SVG, 'svg'), path = document.createElementNS(SVG, 'path');
    s.setAttribute('viewBox', '0 0 10 10'); s.setAttribute('class', 'out'); s.setAttribute('aria-hidden', 'true'); s.setAttribute('focusable', 'false');
    path.setAttribute('d', 'M2 8 L8 2 M3.4 2 H8 V6.6'); path.setAttribute('fill', 'none'); path.setAttribute('stroke', 'currentColor');
    path.setAttribute('stroke-width', '1.1'); path.setAttribute('stroke-linecap', 'round'); path.setAttribute('stroke-linejoin', 'round');
    s.appendChild(path); return s;
  }
  // fills an outbound link: the text, with its last word kept with the arrow so the arrow never wraps alone
  function outLink(a, text, href, wrap, said) {
    var cut = text.lastIndexOf(' '), box = wrap ? el(wrap) : a;
    box.appendChild(document.createTextNode(cut > 0 ? text.slice(0, cut + 1) : ''));
    var nb = el('span', 'nb', cut > 0 ? text.slice(cut + 1) : text); nb.appendChild(arrow()); box.appendChild(nb);
    if (wrap) a.appendChild(box);
    a.appendChild(el('span', 'vh', said));
    a.href = href; a.target = '_blank'; a.rel = 'noopener';
  }
  function get(u) { return fetch(u, { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); }
  var list = document.getElementById('list');
  function say(msg) { list.textContent = ''; list.appendChild(el('p', 'note', msg)); }
  Promise.all([get('archive.json'), get('poem.json')]).then(function (r) {
    var arc = r[0], now = r[1], tonight = now && parts(now.date) ? now.date : null;
    if (!arc || !Array.isArray(arc.poems)) { say('The list could not be loaded just now. Please try again in a little while.'); return; }
    // nothing after tonight's poem is listed before its night; tonight's own entry is marked and leads to the main page
    var poems = arc.poems.filter(function (p) { return p && p.title && parts(p.date) && !(tonight && p.date > tonight); })
      .sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    if (!poems.length) { say('No poems have run yet.'); return; }
    list.textContent = '';
    var ol = null, head = '';
    poems.forEach(function (p, i) {
      if (month(p.date) !== head) { head = month(p.date); list.appendChild(el('h2', '', head)); ol = el('ol'); list.appendChild(ol); }
      var up = tonight && p.date === tonight, page = safe(p.url), book = safe(p.book_url);
      var title = str(p.title), coll = str(p.collection), pub = str(p.publisher), year = str(p.year);
      var li = el('li', up ? 'now' : ''), t = el('time', '', day(p.date)), box = el('div'), h = el('p', 't'), w = null;
      t.setAttribute('datetime', p.date); t.setAttribute('aria-label', longDay(p.date));
      // the title: to the main page while it is up, to the poem's own page where it has one, otherwise plain text
      if (up || page) {
        w = el('p', 'w', up ? 'up now' : 'read it at ' + (str(p.source) || 'its source')); w.id = 'w' + i;
        var a = el('a'); a.setAttribute('aria-describedby', w.id);
        if (up) { a.textContent = title; a.href = 'index.html'; } else outLink(a, title, page, null, ' (opens in a new tab)');
        h.appendChild(a);
      } else h.textContent = title;
      box.appendChild(h);
      if (p.author) box.appendChild(el('p', 'a', str(p.author)));
      // the book line: from Collection · year · Publisher; with a publisher's page, the book's name links to it
      if (coll || year || pub || book) {
        var f = el('p', 'f'), bits = [];
        if (coll) {
          f.append('from ');
          if (book) { var ba = el('a'); outLink(ba, coll, book, 'i', ' (the publisher’s page for the book, opens in a new tab)'); f.appendChild(ba); }
          else f.appendChild(el('i', '', coll));
        }
        if (year) bits.push(document.createTextNode(year));
        if (pub && !(book && !coll)) bits.push(document.createTextNode(pub));
        if (book && !coll) { var bb = el('a'); outLink(bb, pub || 'the book', book, null, ' (the publisher’s page for the book, opens in a new tab)'); bits.push(bb); }
        // each part is kept whole with the dot after it, so the line breaks between parts (the dot ending the line), not
        // inside a name (unless a name is very long)
        if (coll && bits.length) f.append('\u00a0\u00b7');
        bits.forEach(function (b, k) {
          var seg = el('span', (b.textContent || '').length <= 34 ? 'nb' : '');
          if (coll || k) f.append(' ');
          seg.appendChild(b); if (k < bits.length - 1) seg.append('\u00a0\u00b7'); f.appendChild(seg);
        });
        box.appendChild(f);
      }
      if (w) box.appendChild(w);
      li.appendChild(t); li.appendChild(box); ol.appendChild(li);
    });
  });
})();
</script>
</body>
</html>
