/* The website (maxxhillery.com) iframes this address for the 3D room, which now lives at room/. Framed, or addressed with
   any query parameter the room reads, this page hands over to room/ (keeping the query and hash) before anything renders.
   Otherwise it is the app's front page. See docs/room.md. */
(function () {
  var framed = false;
  try { framed = window.self !== window.top; } catch (e) { framed = true; }
  if (framed || /[?&](embed|still|debug|illum|phase|move|sheet|palette)(=|&|$)/.test(location.search)) location.replace('room/' + location.search + location.hash);
})();
</script>
