<script>
(function () {   // the text view and the page's state. No 3D needed here; this runs before three.js loads.
  // Tonight's poem, baked in so the page is never empty; poem.json, fetched by the room, replaces it. The one copy on the page.
  var POEM = {"title": "Sabbaths 2014, III", "author": "Wendell Berry", "lines": ["You don’t know the day until", "You’ve seen the last of it", "Reddening the hill", "And rising into night"], "collection": "Another Day: Sabbath Poems, 2013–2023"};
  // The Moon, shared with the room: its age in days since the new moon, the phase name, and the date line on the sheet.
  // The feed may supply p.date 'YYYY-MM-DD' and p.phase; otherwise both are computed here for 9 pm tonight.
  var SYNODIC = 29.530588853, PHASES = ['New moon', 'Waxing crescent', 'First quarter', 'Waxing gibbous', 'Full moon', 'Waning gibbous', 'Last quarter', 'Waning crescent'];
  var MOON = {
    age: function (d) { return ((d.getTime() / 86400000 + 2440587.5 - 2451550.1) % SYNODIC + SYNODIC) % SYNODIC; },
    phaseName: function (age) { return PHASES[Math.floor(age / SYNODIC * 8 + 0.5) % 8]; },
    night: function (p) {
      var d = p.date ? new Date(p.date + 'T21:00:00') : new Date(); if (!p.date) d.setHours(21, 0, 0, 0);
      var date = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }), phase = p.phase || MOON.phaseName(MOON.age(d));
      return { date: date, phase: phase, line: date + ' · ' + phase };
    }
  };

  //   panel   'scene' | 'text'                        what the reader is looking at; text is always available, and forced once the scene fails
  //   view    'room' | 'reading' | <a review view>    where the camera is; 'reading' is on the sheet (in the Vathograph, the poem overlay)
  //   poem    'baked' | 'tonight'                     whether poem.json has arrived or the baked copy is showing
  // and flags: moving (the camera is between views), orbit (the review orbit), visible (the stage is on screen),
  // longPoem (the sheet hangs over the desk, so there is something to scroll), reason (why the scene failed).
  // Rules: panel is 'text' whenever scene is 'failed'; view can be 'reading' only once the room says the sheet exists.
  // Every change goes through DuskRoom.set(); render() is the only code that writes these facts to the DOM (body classes,
  // data-* attributes, labels, aria); DuskRoom.on() and the 'dusk:state' event tell the room's script, tests, or anyone
  // else driving the page. The named transitions below are the public way to move it: DuskRoom.showText(), .showScene(),

    else if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') { nudge(e.key === 'ArrowDown' ? 1.5 : 8); e.preventDefault(); }
    else if (e.key === 'ArrowUp' || e.key === 'PageUp') { nudge(e.key === 'ArrowUp' ? -1.5 : -8); e.preventDefault(); }
  });
  canvas.addEventListener('wheel', e => { if (S.view !== 'reading' || VATH) return; e.preventDefault(); nudge(e.deltaY * 0.02); }, { passive: false });
  canvas.addEventListener('keydown', e => {                 // the canvas is focusable: Enter or Space reads the poem
    if (S.view !== 'room' || S.orbit || (e.key !== 'Enter' && e.key !== ' ')) return;
    e.preventDefault(); read();
  });

  // the pointer on the canvas: a press that moves more than 6 px while reading is a drag along the sheet, not a click
  const pointer = new THREE.Vector2(), par = new THREE.Vector2(), parTo = new THREE.Vector2(), ray = new THREE.Raycaster();
  let press = null, dragged = false;                        // press: { y, moved } while a pointer is held; dragged: the press that just ended was a drag
  canvas.addEventListener('pointerdown', e => { press = { y: e.clientY, moved: 0 }; dragged = false; });
  canvas.addEventListener('pointermove', e => {
    const r = canvas.getBoundingClientRect();
    pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    if (e.pointerType === 'mouse') parTo.copy(pointer);
    if (press && S.view === 'reading' && !VATH) { const dy = e.clientY - press.y; press.y = e.clientY; press.moved += Math.abs(dy); nudge(-dy * 0.03); }
    if (folderMeshes.length && S.view === 'room') { ray.setFromCamera(pointer, camera); canvas.classList.toggle('over-folder', ray.intersectObjects(folderMeshes, false).length > 0); }
  });
  addEventListener('pointerup', () => { if (press) { dragged = press.moved > 6; press = null; } });   // pointerup comes before click, which reads `dragged`
  canvas.addEventListener('pointerleave', () => parTo.set(0, 0));
  canvas.addEventListener('click', e => {
    if (S.orbit) return;
    if (dragged) { dragged = false; return; }
    if (S.view === 'reading') { leave(); return; }
    const r = canvas.getBoundingClientRect();
    pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(pointer, camera);
    if (ray.intersectObjects(folderMeshes, false).length) read();
  });

  function fovFor(hf) { if (VCAM) { applyVProj(); return; } camera.fov = Math.min(SETTING === 'cafe' ? 82 : 70, 2 * Math.atan(Math.tan(hf / 2) / camera.aspect) * 180 / Math.PI); camera.updateProjectionMatrix(); }
  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight, pr = renderer.getPixelRatio();
    if (canvas.width !== Math.floor(w * pr) || canvas.height !== Math.floor(h * pr)) {
      renderer.setSize(w, h, false); camera.aspect = w / h; fovFor(hfov);
    }
  }
  const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  // review toolbar: views, free orbit for inspection, palette switch, save image
  let controls = null;
  function setOrbit(on) {
    D.set({ orbit: on });
    if (on) {
      if (!controls && THREE.OrbitControls) { controls = new THREE.OrbitControls(camera, canvas); controls.enableDamping = true; controls.dampingFactor = 0.08; controls.minDistance = 0.3; controls.maxDistance = 6; }
      if (!controls) return;
      anim = null; camera.up.set(0, 1, 0); camera.position.copy(cur.pos); controls.target.copy(cur.tgt); controls.enabled = true; controls.update();
    } else if (controls) controls.enabled = false;
  }
  document.querySelectorAll('#devbar [data-view]').forEach(b => b.addEventListener('click', () => goTo(b.dataset.view)));   // scoped: <body data-view> is the state, not a button
  document.getElementById('orbitBtn').addEventListener('click', () => {
    if (S.orbit) { setOrbit(false); goTo(S.view, true); } else setOrbit(true);
  });
  document.querySelectorAll('[data-palette]').forEach(b => b.addEventListener('click', () => {
    setPalette(b.dataset.palette);
    document.querySelectorAll('[data-palette]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  }));
  document.querySelectorAll('[data-palette]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.palette === paletteName)));
  if (SETTING === 'cafe' || SETTING === 'dress') document.querySelector('[data-palette="colour"]').hidden = false;
  document.querySelectorAll('[data-setting]').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.setting === SETTING));
    // (the viewer page builds the Nook only: SETTING_DEFAULT, above, is the one place that chooses the room)
  });
  // Save image: inside claude.ai the viewer only allows saves through the downloads capability, which asks the viewer to
  // confirm; on the website (GitHub Pages) a plain download link works.
  const snapBtn = document.getElementById('snapBtn');
  let downloads = null;
  if (window.claude && window.claude.use) window.claude.use('downloads').then(d => { downloads = d; }).catch(() => {});
  const flash = t => { snapBtn.textContent = t; clearTimeout(flash.t); flash.t = setTimeout(() => { snapBtn.textContent = 'Save image'; }, 2200); };
  function snapCanvas() {
    if (!VATH) return canvas;
    const c = document.createElement('canvas'); c.width = canvas.width; c.height = canvas.height;
    const g = c.getContext('2d');
    if (vathBgImg && vathBgImg.complete) g.drawImage(vathBgImg, 0, 0, c.width, c.height);
    g.drawImage(canvas, 0, 0);
    if (vathFgImg && vathFgImg.complete) g.drawImage(vathFgImg, VFG.x / VFG.W * c.width, VFG.y / VFG.H * c.height, VFG.w / VFG.W * c.width, VFG.h / VFG.H * c.height);
    return c;
  }
  snapBtn.addEventListener('click', () => {
    PRE_RENDER.forEach(f => f()); renderer.render(scene, camera);
    const name = 'dusk-room-' + (SETTING || 'nook') + '-' + S.view + '.png';
    if (!window.claude) { const a = document.createElement('a'); a.href = snapCanvas().toDataURL('image/png'); a.download = name; document.body.appendChild(a); a.click(); a.remove(); return; }
    if (!downloads) { flash('Saving isn\u2019t available here'); return; }
    snapCanvas().toBlob(blob => {
      if (!blob) { flash('Couldn\u2019t capture the view'); return; }
      downloads.save({ filename: name, data: blob }).then(() => flash('Saved'), e => {
        const c = e && e.code;
        flash(c === 'declined' ? 'Not saved' : c === 'rate_limited' ? 'One moment, then try again' : 'Saving isn\u2019t available here');
      });
    }, 'image/png');
  });

  // ---------- floating callouts: author and collection, anchored to the folder, projected each frame ----------
  const CA = document.getElementById('calloutA'), CB = document.getElementById('calloutB'), CL = document.getElementById('calloutLines');
  const lineA = document.getElementById('lineA'), lineB = document.getElementById('lineB'), dotA = document.getElementById('dotA'), dotB = document.getElementById('dotB');
  CB.classList.add('coll');
  let calloutAnchors = null, labelsOn = true;
  function setCallouts(p) {
    document.getElementById('calloutAuthor').textContent = p.author || '';
    CA.hidden = !p.author;
    const coll = p.collection ? p.collection + (p.year ? ', ' + p.year : '') : '';
    document.getElementById('calloutCollection').textContent = coll;
    CB.hidden = !coll;
  }
  document.getElementById('labelsBtn').addEventListener('click', e => { labelsOn = !labelsOn; e.currentTarget.setAttribute('aria-pressed', String(labelsOn)); });
  const pv = new THREE.Vector3();
  function placeCallouts() {
    if (!calloutAnchors) return;
    const vis = labelsOn && !S.orbit ? roomness(0.007, 0.005) : (labelsOn && S.orbit ? 1 : 0);   // fade out in the reading view
    [CA, CB].forEach(c => c.style.opacity = vis); CL.style.opacity = vis; CL.classList.toggle('off', vis === 0);
    if (vis === 0) return;
    // one leader line from the sheet to the AUTHOR pill; the FROM pill stacks just beneath it (2026-11-04)
    const w = canvas.clientWidth, h = canvas.clientHeight;
    lineB.setAttribute('visibility', 'hidden'); dotB.setAttribute('visibility', 'hidden');
    pv.copy(calloutAnchors[0]).project(camera);
    const ax = (pv.x + 1) / 2 * w, ay = (1 - pv.y) / 2 * h, ok = pv.z < 1;
    const top = CA.hidden ? CB : CA, bw = Math.max(CA.hidden ? 0 : CA.offsetWidth, CB.hidden ? 0 : CB.offsetWidth);
    const bh = top.offsetHeight, stackH = bh + (CA.hidden || CB.hidden ? 0 : CB.offsetHeight + 2.25);
    let lx = ax - Math.min(80, w * 0.07) - bw, ly = ay - Math.min(64, h * 0.11) - bh / 2;
    lx = Math.max(8, Math.min(w - bw - 8, lx)); ly = Math.max(8, Math.min(h - stackH - 8, ly));
    if (!CA.hidden) CA.style.transform = `translate(${(lx + bw - CA.offsetWidth).toFixed(1)}px, ${ly.toFixed(1)}px)`;
    if (!CB.hidden) CB.style.transform = `translate(${(lx + bw - CB.offsetWidth).toFixed(1)}px, ${(CA.hidden ? ly : ly + bh + 2.25).toFixed(1)}px)`;
    lineA.setAttribute('x1', ax); lineA.setAttribute('y1', ay); lineA.setAttribute('x2', lx + bw); lineA.setAttribute('y2', ly + bh / 2);
    dotA.setAttribute('cx', ax); dotA.setAttribute('cy', ay);
    [lineA, dotA].forEach(n => n.setAttribute('visibility', ok ? 'visible' : 'hidden'));
    [CA, CB].forEach(c => c.style.visibility = ok ? 'visible' : 'hidden');
  }

  const side = new THREE.Vector3(), upv = new THREE.Vector3();
  // the stage scrolled out of view (a long host page), or the text showing: the room is left as it is
  if (window.IntersectionObserver) new IntersectionObserver(([en]) => D.set({ visible: en.isIntersecting }), { threshold: 0 }).observe(document.getElementById('stage'));
  // ?debug=1: frame time in the stage's corner, averaged over the last second, with the shadow rate and pixel ratio
  const PERF = D.perf = { frameMs: 0, fps: 0, shadowEvery: 2 };
  let perfEl = null, perfAcc = 0, perfN = 0, perfLast = 0;
  if (/[?&]debug=1/.test(location.search)) { perfEl = document.createElement('div'); perfEl.id = 'perf'; perfEl.setAttribute('aria-hidden', 'true');
    perfEl.style.cssText = 'position:absolute;right:10px;top:8px;z-index:9;font:500 11px/1.4 "Instrument Sans",monospace;letter-spacing:.04em;color:#ecebe6;background:rgba(20,22,27,.72);padding:4px 8px;border-radius:6px;pointer-events:none;white-space:pre';
    document.getElementById('stage').appendChild(perfEl); }
  function perf(now) {
    if (perfLast) { perfAcc += now - perfLast; perfN++; }
    perfLast = now;
    if (perfAcc >= 1000) { PERF.frameMs = perfAcc / perfN; PERF.fps = 1000 / PERF.frameMs; perfAcc = 0; perfN = 0;
      if (perfEl) perfEl.textContent = PERF.frameMs.toFixed(1) + ' ms/frame  ' + PERF.fps.toFixed(0) + ' fps\nshadows 1/' + PERF.shadowEvery + '  dpr ' + renderer.getPixelRatio() + '  ' + renderer.domElement.width + 'x' + renderer.domElement.height; }
  }
  function tick(now) {
    if (!S.visible || S.panel === 'text') { perfLast = 0; requestAnimationFrame(tick); return; }   // nothing to draw
    perf(now);
    resize();
    PERF.shadowEvery = S.moving ? 3 : 2;
    renderer.shadowMap.needsUpdate = shadowFrame++ % PERF.shadowEvery === 0;   // the first frame always draws them
    EVERY_FRAME.forEach(f => f(now));
    if (VCAM) {                                              // one fixed view: no zoom, parallax or drift
      camera.position.copy(VCAM.pos); camera.quaternion.copy(VCAM.q); camera.updateMatrixWorld(); applyVProj();
      PRE_RENDER.forEach(f => f()); renderer.render(scene, camera); placeCallouts(); requestAnimationFrame(tick); return;
    }
    if (anim) {
      const k = Math.min(1, (now - anim.t0) / anim.dur), e = ease(k);
      cur.pos.lerpVectors(anim.fp, anim.to.pos, e); cur.tgt.lerpVectors(anim.ft, anim.to.tgt, e);
      cur.up.lerpVectors(anim.fu, anim.to.up, e).normalize(); cur.par = anim.fpar + (anim.to.par - anim.fpar) * e;
      if (k >= 1) { anim = null; D.set({ moving: false }); }
    } else if (S.view === 'reading' && path) {               // follow the sheet
      sRead += (sReadTo - sRead) * 0.12;
      const q = readingPose(sRead); cur.pos.copy(q.pos); cur.tgt.copy(q.tgt); cur.up.copy(q.up); cur.par = q.par;
      const [lo, hi] = sBounds(); progressFill.style.height = (hi > lo ? (sRead - lo) / (hi - lo) * 100 : 0).toFixed(1) + '%';
    }
    if (HFOV_ROOM !== HFOV_READ) {                          // the café: room views are wide, the reading view is the Nook's
      const k = roomness(0.006, 0.004), want = HFOV_READ + (HFOV_ROOM - HFOV_READ) * k;
      if (Math.abs(want - hfov) > 1e-4) { hfov = want; fovFor(hfov); }
    }
    if (S.orbit && controls) {
      controls.update(); PRE_RENDER.forEach(f => f()); renderer.render(scene, camera); placeCallouts(); requestAnimationFrame(tick); return;
    }
    if (LAMP) { const t = roomness(0.006, 0.044); LAMP.intensity = LAMP_LO + (LAMP_HI - LAMP_LO) * t; }   // full in the room, low up close
    par.lerp(parTo, 0.06);
    camera.up.copy(cur.up);
    camera.position.copy(cur.pos); camera.lookAt(cur.tgt);
    side.setFromMatrixColumn(camera.matrixWorld, 0); upv.setFromMatrixColumn(camera.matrixWorld, 1);
    camera.position.addScaledVector(side, par.x * cur.par).addScaledVector(upv, par.y * cur.par * 0.5);
    if (IDLE_DRIFT) { const tt = now / 1000, k = cur.par / 0.05;   // a centimetre or so over ten seconds, nothing up close
      camera.position.addScaledVector(upv, Math.sin(tt * 2 * Math.PI / 10) * 0.008 * k).addScaledVector(side, Math.sin(tt * 2 * Math.PI / 23 + 1) * 0.006 * k); }
    camera.lookAt(cur.tgt);
    PRE_RENDER.forEach(f => f()); renderer.render(scene, camera);
    placeCallouts();
    requestAnimationFrame(tick);
  }

  // ---------- bookmark (2026-11-03): Maxx's starburst plate (figures A-H) on a cream card, tucked under the top sheet
  // with its top third peeking out the right side of the stack, dipping onto the desk beyond the folder ----------
  const BOOKMARK_SRC = 'assets/bookmark.jpg';
  function makeBookmark(a, tb, pb) {
    const BW = 2.25 * U, BL = 7.5 * U, OUT = 3.0 * U, ROT = -82 * Math.PI / 180;   // top end points right
    const geo = new THREE.PlaneGeometry(BW, BL, 1, 40); geo.rotateX(-Math.PI / 2);   // flat; local -z is its far (top) end
    const cx = a.x + SHEET_W * U / 2 + OUT - (BL / 2) * Math.sin(-ROT), cz = a.zBack + 3.4 * U, y0 = a.yOnFolder - 0.0004;
    const pos = geo.attributes.position, edge = pb.max.x;                // where the folder panel ends, to the right
    for (let i = 0; i < pos.count; i++) {
      const lx = pos.getX(i), lz = pos.getZ(i);
      const x = cx + lx * Math.cos(ROT) + lz * Math.sin(ROT), z = cz - lx * Math.sin(ROT) + lz * Math.cos(ROT);
      const past = Math.max(0, x - edge), drop = Math.min(1, past / (0.9 * U));   // beyond the panel it settles onto the desk
      pos.setXYZ(i, x, y0 - (y0 - (a.deskY + 0.0006)) * drop * drop * (3 - 2 * drop), z);
    }
    geo.computeVertexNormals();
    const tex = new THREE.TextureLoader().load(BOOKMARK_SRC);
    tex.encoding = THREE.sRGBEncoding; tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    const mat = new THREE.MeshStandardMaterial({ map: tex, color: 0xcfcac2, roughness: 0.9, metalness: 0, side: THREE.DoubleSide,   // toned so the card stays cream under the key
      polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -12 });
    mat.envMapIntensity = ENV_SUBJECT;
    const m = new THREE.Mesh(geo, mat); m.name = 'Folder_Bookmark'; m.receiveShadow = true;
    scene.add(m); folderMeshes.push(m);
  }

  // setPoem: tonight's poem into every place it shows (text view, overlay, callouts, the sheet). source: 'tonight' (poem.json) or 'baked'.
  function setPoem(p, source) {
    if (window.__showText) window.__showText(p); if (VATH) fillOverlay(p); setCallouts(p); drawSheet(p); buildSheet();
    D.canRead = !!path;
    D.set({ longPoem: sheetL > MIN_L + 0.5, poem: source || 'tonight' });
    if (S.view === 'reading') { sRead = sReadTo = readStart(); }
  }

  (async function start() {
    try {
      const [desk] = await Promise.all([loadDesk(), document.fonts.load('400 58px "EB Garamond"'), document.fonts.load('500 58px "EB Garamond"'), document.fonts.load('italic 400 46px "EB Garamond"')]);
      let topRef = null, deskTop = null, panelR = null;
      desk.traverse(o => {
        if (!o.isMesh) return;
        o.castShadow = true; o.receiveShadow = true;
        if (o.material) { o.material.envMapIntensity = ENV_SUBJECT; if (o.material.map) o.material.map.anisotropy = renderer.capabilities.getMaxAnisotropy(); }
        if (/^Folder_/.test(o.name)) folderMeshes.push(o);
        if (/^Folder_Sheet/.test(o.name)) {                     // paper-thin sheets: no shadow speckle, each layer drawn over the one below
          o.castShadow = false; o.receiveShadow = false;
          const layer = +(o.name.match(/Sheet_(\d)/) || [0, 0])[1];
          o.material = o.material.clone();
          Object.assign(o.material, { polygonOffset: true, polygonOffsetFactor: -layer, polygonOffsetUnits: -4 * layer });
        }
        if (/^Folder_Top/.test(o.name)) { topRef = o; o.visible = false; }   // placement reference for the live sheet
        if (/^Desk_Top/.test(o.name)) deskTop = o;
        if (/^Folder_Panel_R/.test(o.name)) panelR = o;
      });
      if (VATH) desk.traverse(o => { if (o.isMesh && !/^Folder_/.test(o.name)) o.visible = false; });   // the folder stays where the model has it; the camera was solved around it
      if (CAFE) {                                             // the folder alone, centred on the table, 4 in from its back edge
        const T = CAFE.T;
        desk.traverse(o => { if (o.isMesh && !/^Folder_/.test(o.name)) o.visible = false; });
        desk.position.set((T.cx - 4.75) * U, (T.h - 30) * U, (-T.cy - T.d / 2 + (T.inset || 4) - 8) * U);
      }
      if (!CAFE && !VATH) {   // round two: the open folder rests a hair higher on its left, on the kraft folder slid under it; the drawer is left open an inch
        const tilt = new THREE.Matrix4().makeTranslation(14.9 * U, 30 * U, 0).multiply(new THREE.Matrix4().makeRotationZ(-0.012)).multiply(new THREE.Matrix4().makeTranslation(-14.9 * U, -30 * U, 0));
        let dm = null;
        desk.traverse(o => { if (!o.isMesh) return; if (/^Folder_/.test(o.name)) o.applyMatrix4(tilt); if (/^Drawer_/.test(o.name)) o.position.z += 1.1 * U; if (o.name === 'Drawer_Front') dm = o.material; });
        const add = (sx, sy, sz, x, y, z, m) => { const b = new THREE.Mesh(new THREE.BoxGeometry(sx * U, sy * U, sz * U), m); b.position.set(x * U, y * U, z * U); b.castShadow = b.receiveShadow = true; scene.add(b); };
        if (dm) { add(0.4, 2.6, 1.2, -1.55, 26.25, 26.05, dm); add(0.4, 2.6, 1.2, 13.05, 26.25, 26.05, dm); }
        add(14.2, 0.05, 1.05, 5.75, 27.45, 26.05, new THREE.MeshBasicMaterial({ color: 0x17120d }));
      }
      scene.add(desk); desk.updateMatrixWorld(true);
      const tb = new THREE.Box3().setFromObject(topRef), pb = new THREE.Box3().setFromObject(panelR);
      const db = VATH ? new THREE.Box3(new THREE.Vector3(-0.16, 0, -0.03), new THREE.Vector3(0.54, 0.762, 0.646))   // the photo's table: top under the playmat, front edge 5.5 cm ahead of where the laptop stood
             : CAFE ? new THREE.Box3(new THREE.Vector3((CAFE.T.cx - CAFE.T.w / 2) * U, 0, (-CAFE.T.cy - CAFE.T.d / 2) * U),
                                       new THREE.Vector3((CAFE.T.cx + CAFE.T.w / 2) * U, CAFE.T.h * U, (-CAFE.T.cy + CAFE.T.d / 2) * U))
                      : new THREE.Box3().setFromObject(deskTop);
      // the sheet steps down to the desk only past the furthest-reaching panel or loose sheet beneath it
      let front = pb.max.z;
      folderMeshes.forEach(m => { if (m !== topRef && /^Folder_(Sheet|Panel)/.test(m.name)) front = Math.max(front, new THREE.Box3().setFromObject(m).max.z); });
      calloutAnchors = [new THREE.Vector3(tb.min.x + 0.03, tb.max.y, (tb.min.z + tb.max.z) / 2 - 0.02),   // the sheet's left side
                        new THREE.Vector3(tb.max.x - 0.03, tb.max.y, tb.min.z + 0.05)];                    // its far right corner
      const anchor = { x: (tb.min.x + tb.max.x) / 2, zBack: tb.min.z, yOnFolder: tb.max.y, zFolderFront: front + 0.004, deskY: db.max.y, zEdge: db.max.z };
      path = buildPath(anchor); makeContact(anchor); makeBookmark(anchor, tb, pb);
      if (CAFE || VATH) { scene.remove(contact); contact = null; }   // the café table has no apron for the hanging sheet to shade
      let poem = PLACEHOLDER, source = 'baked';
      try { const r = await fetch('poem.json', { cache: 'no-store' }); if (r.ok) { poem = await r.json(); source = 'tonight'; } } catch (e) { /* the baked copy stays */ }
      setPoem(poem, source);
      requestAnimationFrame(() => requestAnimationFrame(() => D.sceneReady()));   // after the first frame has drawn: the loading screen fades, the room settles in
    } catch (e) {
      toText('The scene did not load.');
      console.error(e);
    }
  })();
  goTo('room', true);
  requestAnimationFrame(tick);
  // the room's transitions, on the shared state object, and the older hooks for anything that still calls them
  Object.assign(D, { read, leave, goTo, setPoem, nudge, setPalette });
  window.__goTo = goTo; window.__setPalette = setPalette; window.__setPoem = setPoem; window.__nudge = nudge;
}
// Let the loading screen (and the Text-only button) paint first, then fetch the dust and build the room.
requestAnimationFrame(() => setTimeout(async () => {
  let dust = null;
  try { const r = await fetch('assets/dust.json'); if (r.ok) dust = await r.json(); } catch (e) { /* no dust tonight */ }
  try { await buildRoom(dust); }
  catch (e) { window.DuskRoom.sceneFailed('The scene did not load.'); console.error(e); }
}, 0));
</script>
